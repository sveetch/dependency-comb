;;
;; Dependency comb package
;;
[metadata]
name = dependency-comb
version = 0.5.0-pre.13
description = A tool to analyze requirements with Pypi API
long_description = file:README.rst
long_description_content_type = text/x-rst
author = David Thenon
author_email = sveetch@gmail.com
url = https://github.com/sveetch/dependency-comb
project_urls =
    Source Code = https://github.com/sveetch/dependency-comb
    Issue Tracker = https://github.com/sveetch/dependency-comb/issues
    Changelog = https://dependency-comb.readthedocs.io/en/latest/history.html
    Documentation = https://dependency-comb.readthedocs.io/
license = MIT
keywords = Python
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Natural Language :: English
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10

[options]
include_package_data = True
install_requires =
    click>=8.0
    colorlog>=6.8.2
    requests>=2.32.3
    humanize>=4.9.0
    packaging>=24.0
    tabulate>=0.9.0
packages = find:
zip_safe = True

[options.extras_require]
rich =
    rich>=13.6.0
    rich-click>=1.9.9,<2.0.0
dev =
    pytest>=7.0
    freezegun>=1.2.0
quality =
    flake8>=6.0.0
    tox>=4.11.0
doc =
    sphinx>=8.0.2
    furo>=2024.8.6
    sphinx-copybutton>=0.5.2
doc-live =
    livereload>=2.6.0
release =
    setuptools>=81
    twine>=5.0.0

[options.packages.find]
where = .
exclude=
    data
    docs
    tests

[options.entry_points]
console_scripts =
    dependency-comb = dependency_comb.cli.entrypoint:cli_frontend

[wheel]
universal = 0

;;
;; Third-party packages configuration
;;
[flake8]
max-line-length = 88
exclude =
    .git,
    .venv,
    build,
    __pycache__

[tool:pytest]
addopts = -vv --ignore=tests/data_fixtures
python_files =
    *.py
testpaths =
    tests

[tox:tox]
minversion = 3.4.0
envlist =
    {py38}-{no_rich,rich},
    {py310}-{no_rich,rich},
    {py313}-{no_rich,rich},
    {py314}-{no_rich,rich},

[testenv]
deps =
    rich: rich>=13.6.0

commands =
    pip install -e .[dev]
    pytest -vv tests
